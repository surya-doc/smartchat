name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Unit tests + integration tests (Testcontainers starts MySQL in Docker on the runner).
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      # Surface the important error lines as annotations on the commit / PR,
      # so failures are readable without digging through the full log.
      - name: Summarize failures
        if: failure()
        shell: bash
        run: |
          {
            grep -E '^\[ERROR\]' build.log | grep -vE '^\[ERROR\] *$|-> \[Help|Re-run Maven|full stack trace|For more information|^\[ERROR\] \[Help' || true
            if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
              grep -hE 'Caused by|Exception:|expected|Status' target/surefire-reports/*.txt | grep -v '^\s*at ' || true
            fi
          } | awk '!seen[$0]++' | head -80 > failures.txt
          split -l 8 failures.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build failure::${msg}"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            build.log
