# Local infrastructure for SmartChat.
#   docker compose up -d      start MySQL, Redis and Kafka
#   docker compose down       stop them (data is kept in the mysql-data volume)
#   docker compose down -v    stop and wipe the database
#
# MySQL is published on 3307 so it does not clash with a MySQL already installed on 3306.

services:
  mysql:
    image: mysql:8.4
    container_name: smartchat-mysql
    environment:
      MYSQL_DATABASE: smartchat
      MYSQL_USER: smartchat
      MYSQL_PASSWORD: smartchat
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: smartchat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). Listens on localhost:9092.
    image: apache/kafka:4.1.0
    container_name: smartchat-kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  mysql-data:
