# Local development profile (active by default).
# Matches docker-compose.yml: run `docker compose up -d` before starting the app.
# These are throwaway local credentials, not secrets.

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/smartchat
    username: smartchat
    password: smartchat
  data:
    redis:
      url: redis://localhost:6379

app:
  jwt:
    secret: dev-only-secret-change-me-in-production-0123456789
  frontend-url: http://localhost:4200
  cors-allowed-origins: http://localhost:4200

logging:
  level:
    com.smartchat: DEBUG
